name: synapseos

x-synapse-environment: &synapse-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?database URL required}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  TRUSTED_HOSTS: '${TRUSTED_HOSTS:-["api","localhost","127.0.0.1"]}'
  DASHBOARD_SERVICE_TOKEN: ${DASHBOARD_SERVICE_TOKEN:?dashboard service token required}
  OIDC_ISSUER: ${OIDC_ISSUER:?OIDC issuer required}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC audience required}
  OIDC_DISCOVERY_TIMEOUT_SECONDS: ${OIDC_DISCOVERY_TIMEOUT_SECONDS:-5}
  OIDC_MAX_RESPONSE_BYTES: ${OIDC_MAX_RESPONSE_BYTES:-65536}
  OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
  OIDC_MAX_JWKS_KEYS: ${OIDC_MAX_JWKS_KEYS:-16}
  GITHUB_BASE_URL: ${GITHUB_BASE_URL:-https://api.github.com}
  GITHUB_MAX_RESPONSE_BYTES: ${GITHUB_MAX_RESPONSE_BYTES:-16777216}
  GITHUB_SERVICE_TOKEN: ${GITHUB_SERVICE_TOKEN:?GitHub service token required}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
  OLLAMA_MAX_RESPONSE_BYTES: ${OLLAMA_MAX_RESPONSE_BYTES:-10485760}
  WORKSPACE_BASE_ROOT: /var/lib/synapseos/workspaces
  GIT_EXECUTABLE: /usr/bin/git
  ENGINEERING_V1_TIMEOUT_SECONDS: ${ENGINEERING_V1_TIMEOUT_SECONDS:-900}
  QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-1000}
  QUEUE_WORKER_COUNT: ${QUEUE_WORKER_COUNT:-4}
  QUEUE_POLL_INTERVAL_SECONDS: ${QUEUE_POLL_INTERVAL_SECONDS:-0.25}
  QUEUE_HEARTBEAT_INTERVAL_SECONDS: ${QUEUE_HEARTBEAT_INTERVAL_SECONDS:-5}
  QUEUE_RECOVERY_INTERVAL_SECONDS: ${QUEUE_RECOVERY_INTERVAL_SECONDS:-10}

x-synapse-service: &synapse-service
  build:
    context: .
  environment: *synapse-environment
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  volumes:
    - synapseos_workspaces:/var/lib/synapseos/workspaces

x-authentik-environment: &authentik-environment
  AUTHENTIK_POSTGRESQL__HOST: authentik-db
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:?authentik database password required}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?authentik secret key required}
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  NUXT_OIDC_CLIENT_ID: ${NUXT_OIDC_CLIENT_ID:?OIDC client ID required}
  NUXT_OIDC_CLIENT_SECRET: ${NUXT_OIDC_CLIENT_SECRET:?OIDC client secret required}
  NUXT_OIDC_REDIRECT_URI: ${NUXT_OIDC_REDIRECT_URI:?OIDC redirect URI required}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_DB: ${POSTGRES_DB:-synapseos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - synapseos_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *synapse-service
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?database URL required}
    volumes: []
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *synapse-service
    build:
      context: .
      target: api
    environment:
      <<: *synapse-environment
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - backend
      - egress
      - frontend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *synapse-service
    build:
      context: .
      target: worker
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      NITRO_PRESET: node-server
      NUXT_BACKEND_BASE_URL: http://api:8000
      NUXT_BACKEND_TIMEOUT_MS: ${NUXT_BACKEND_TIMEOUT_MS:-8000}
      NUXT_BACKEND_MAX_RESPONSE_BYTES: ${NUXT_BACKEND_MAX_RESPONSE_BYTES:-1048576}
      NUXT_BACKEND_SERVICE_TOKEN: ${NUXT_BACKEND_SERVICE_TOKEN:?backend service token required}
      NUXT_OIDC_AUTHORIZATION_ENDPOINT: ${NUXT_OIDC_AUTHORIZATION_ENDPOINT:?OIDC authorization endpoint required}
      NUXT_OIDC_TOKEN_ENDPOINT: ${NUXT_OIDC_TOKEN_ENDPOINT:?OIDC token endpoint required}
      NUXT_OIDC_CLIENT_ID: ${NUXT_OIDC_CLIENT_ID:?OIDC client ID required}
      NUXT_OIDC_CLIENT_SECRET: ${NUXT_OIDC_CLIENT_SECRET:?OIDC client secret required}
      NUXT_OIDC_REDIRECT_URI: ${NUXT_OIDC_REDIRECT_URI:?OIDC redirect URI required}
      NUXT_OIDC_COMPANY_SLUG: ${NUXT_OIDC_COMPANY_SLUG:?company slug required}
      NUXT_OIDC_TIMEOUT_MS: ${NUXT_OIDC_TIMEOUT_MS:-8000}
      NUXT_OIDC_MAX_RESPONSE_BYTES: ${NUXT_OIDC_MAX_RESPONSE_BYTES:-65536}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  smoke:
    build:
      context: .
      target: smoke
    profiles: ["smoke"]
    restart: "no"
    environment:
      SMOKE_DATABASE_URL: ${DATABASE_URL:?database URL required}
      SMOKE_API_URL: http://api:8000/ready
      SMOKE_FRONTEND_URL: http://web:3000/login
      SMOKE_OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?OIDC discovery URL required}
      SMOKE_TIMEOUT_SECONDS: ${SMOKE_TIMEOUT_SECONDS:-5}
      SMOKE_MAX_RESPONSE_BYTES: ${SMOKE_MAX_RESPONSE_BYTES:-65536}
    networks:
      - backend
      - egress
      - frontend
    depends_on:
      api:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      worker:
        condition: service_healthy

  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:?authentik database password required}
      POSTGRES_DB: authentik
    volumes:
      - authentik_pgdata:/var/lib/postgresql/data
    networks:
      - identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    restart: unless-stopped
    stop_grace_period: 30s
    environment: *authentik-environment
    ports:
      - "127.0.0.1:${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "127.0.0.1:${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    volumes:
      - authentik_data:/data
      - ./deployment/authentik/synapseos.yaml:/blueprints/custom/synapseos.yaml:ro
    networks:
      - frontend
      - identity
    depends_on:
      authentik-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: worker
    restart: unless-stopped
    stop_grace_period: 30s
    environment: *authentik-environment
    volumes:
      - authentik_data:/data
      - ./deployment/authentik/synapseos.yaml:/blueprints/custom/synapseos.yaml:ro
    networks:
      - identity
    depends_on:
      authentik-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress: {}
  frontend: {}
  identity:
    internal: true

volumes:
  authentik_data:
  authentik_pgdata:
  synapseos_pgdata:
  synapseos_workspaces:
